version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flow-agente-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-flow_agente}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - flow-network

  redis:
    image: redis:7-alpine
    container_name: flow-agente-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - flow-network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: flow-agente-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-flow_agente}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-flow-agente-super-secret-jwt-key}
      PORT: 3000
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evolution_secret_api_key}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - flow-network

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: flow-agente-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - flow-network

volumes:
  pgdata:
  redisdata:

networks:
  flow-network:
    driver: bridge
